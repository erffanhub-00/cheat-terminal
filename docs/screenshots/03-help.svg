<text x="228.0" y="212.0" fill="#e2e8f0">  </text>
<text x="244.0" y="212.0" fill="#ffffff" font-weight="bold">SEARCH — ↑↓ move · Tab category · Enter copy</text>
<text x="596.0" y="212.0" fill="#e2e8f0">                    </text>
<text x="756.0" y="212.0" fill="#0000ff">│</text>
<text x="764.0" y="212.0" fill="#e2e8f0">                          </text>
<text x="12.0" y="229.0" fill="#e2e8f0">                          </text>
<text x="220.0" y="229.0" fill="#0000ff">│</text>
<text x="228.0" y="229.0" fill="#e2e8f0">    Esc clears the query, then list mode · Ctrl+C quit            </text>
<text x="756.0" y="229.0" fill="#0000ff">│</text>
<text x="764.0" y="229.0" fill="#e2e8f0">                          </text>

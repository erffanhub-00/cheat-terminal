<text x="228.0" y="314.0" fill="#e2e8f0">  </text>
<text x="244.0" y="314.0" fill="#ffffff" font-weight="bold">ADD (a) — Command → Description → Category → Tags → Level</text>
<text x="700.0" y="314.0" fill="#e2e8f0">       </text>
<text x="756.0" y="314.0" fill="#0000ff">│</text>
<text x="764.0" y="314.0" fill="#e2e8f0">                          </text>
<text x="12.0" y="331.0" fill="#e2e8f0">                          </text>
<text x="220.0" y="331.0" fill="#0000ff">│</text>
<text x="228.0" y="331.0" fill="#e2e8f0">    New category name creates it · Level 1/2/3 (empty = 2)        </text>
<text x="756.0" y="331.0" fill="#0000ff">│</text>
<text x="764.0" y="331.0" fill="#e2e8f0">                          </text>
<text x="12.0" y="348.0" fill="#e2e8f0">                          </text>
<text x="220.0" y="348.0" fill="#0000ff">│</text>
<text x="228.0" y="348.0" fill="#e2e8f0">  EXPORT (E) — scope (all or a category), then filename           </text>
<text x="756.0" y="348.0" fill="#0000ff">│</text>
<text x="764.0" y="348.0" fill="#e2e8f0">                          </text>
<text x="12.0" y="365.0" fill="#e2e8f0">                          </text>
<text x="220.0" y="365.0" fill="#0000ff">│</text>
<text x="228.0" y="365.0" fill="#e2e8f0">  IMPORT (I) — file path, then category (empty = from file)       </text>
<text x="756.0" y="365.0" fill="#0000ff">│</text>
<text x="764.0" y="365.0" fill="#e2e8f0">                          </text>
<text x="12.0" y="382.0" fill="#e2e8f0">                          </text>
<text x="220.0" y="382.0" fill="#0000ff">│</text>
<text x="228.0" y="382.0" fill="#e2e8f0">  DELETE (d) — y deletes, n / Esc keeps it                        </text>
<text x="756.0" y="382.0" fill="#0000ff">│</text>

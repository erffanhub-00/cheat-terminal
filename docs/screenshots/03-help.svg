<text x="228.0" y="263.0" fill="#e2e8f0">  </text>
<text x="244.0" y="263.0" fill="#ffffff" font-weight="bold">LIST — ↑↓ j k move · Enter / c copy · s favorite · f filter</text>
<text x="716.0" y="263.0" fill="#e2e8f0">     </text>
<text x="756.0" y="263.0" fill="#0000ff">│</text>
<text x="764.0" y="263.0" fill="#e2e8f0">                          </text>
<text x="12.0" y="280.0" fill="#e2e8f0">                          </text>
<text x="220.0" y="280.0" fill="#0000ff">│</text>
<text x="228.0" y="280.0" fill="#e2e8f0">    a add · C category · d delete · E export · I import · q quit  </text>
<text x="756.0" y="280.0" fill="#0000ff">│</text>
<text x="764.0" y="280.0" fill="#e2e8f0">                          </text>
<text x="12.0" y="297.0" fill="#e2e8f0">                          </text>

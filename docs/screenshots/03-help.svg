<text x="220.0" y="144.0" fill="#0000ff">│</text>
<text x="228.0" y="144.0" fill="#e2e8f0">  </text>
<text x="244.0" y="144.0" fill="#ffffff" font-weight="bold">MODES — SEARCH: typing goes to the search box.</text>
<text x="612.0" y="144.0" fill="#e2e8f0">                  </text>
<text x="756.0" y="144.0" fill="#0000ff">│</text>
<text x="764.0" y="144.0" fill="#e2e8f0">                          </text>
<text x="12.0" y="161.0" fill="#e2e8f0">                          </text>
<text x="220.0" y="161.0" fill="#0000ff">│</text>
<text x="228.0" y="161.0" fill="#e2e8f0">    Press Esc once to switch to list mode, where keys work.       </text>
<text x="756.0" y="161.0" fill="#0000ff">│</text>
<text x="764.0" y="161.0" fill="#e2e8f0">                          </text>
<text x="12.0" y="178.0" fill="#e2e8f0">                          </text>
<text x="220.0" y="178.0" fill="#0000ff">│</text>
<text x="228.0" y="178.0" fill="#e2e8f0">    LIST: single keys work directly. Esc or / back to search.     </text>
<text x="756.0" y="178.0" fill="#0000ff">│</text>
<text x="764.0" y="178.0" fill="#e2e8f0">                          </text>
<text x="12.0" y="195.0" fill="#e2e8f0">                          </text>
